name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Tune Gradle memory for CI runner
        run: |
          sed -i 's/-Xmx3G/-Xmx2G/g; s/-XX:MaxMetaspaceSize=1G/-XX:MaxMetaspaceSize=768m/g' android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build_apk.log || {
            ERR=$(grep -m 1 -A 4 "Error: " build_apk.log | tr '\n' ' ')
            [ -z "$ERR" ] && ERR=$(grep -A 12 "What went wrong:" build_apk.log | tr '\n' ' ')
            echo "::error::$ERR"
            exit 1
          }

      - name: Rename APK asset
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp build/app/outputs/flutter-apk/app-release.apk "qujianma-${TAG}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: qujianma-*.apk

      - name: Upload workflow artifact (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: qujianma-release-apk
          path: qujianma-*.apk

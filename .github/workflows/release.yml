name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Tune Gradle memory for CI runner
        run: |
          sed -i 's/-Xmx3G/-Xmx2G/g; s/-XX:MaxMetaspaceSize=1G/-XX:MaxMetaspaceSize=768m/g' android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_DEBUG_KEYSTORE_BASE64; refusing to build with random keystore."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/ci-signing.keystore
          ls -la android/app/ci-signing.keystore

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build_apk.log || {
            ERR=$(grep -m 1 -A 4 "Error: " build_apk.log | tr '\n' ' ')
            [ -z "$ERR" ] && ERR=$(grep -A 12 "What went wrong:" build_apk.log | tr '\n' ' ')
            echo "::error::$ERR"
            exit 1
          }

      - name: Verify APK signing certificate SHA-256
        run: |
          EXPECTED_SHA256="214fa2e2d37351fa0129b119bf9ca1251d9cae6df6ce63cd13e1632c636a1e3f"
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual   SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK signature mismatch! Expected $EXPECTED_SHA256 but got $ACTUAL_SHA256"
            exit 1
          fi

      - name: Rename APK asset
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp build/app/outputs/flutter-apk/app-release.apk "qujianma-${TAG}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: qujianma-*.apk

      - name: Upload workflow artifact (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: qujianma-release-apk
          path: qujianma-*.apk
